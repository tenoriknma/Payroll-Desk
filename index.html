<!doctype html>
<html lang="en">
<head>
<title>Payroll Desk</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working surface. Header with period controls, four tabs, a wide scrollable grid or table underneath. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#17211e; --muted:#5b6a65; --line:#d8e0dd; --soft:#e9efed;
  --accent:#2447b5; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --good:#17794f; --good-bg:#dcf2e6; --bad:#b0321e; --bad-bg:#fbe3de; --warn:#8a5a00; --warn-bg:#fff0c9;
  --rest:#e6ebea;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --ink:#e5eeea; --muted:#92a39d; --line:#2a3a37; --soft:#1e2c2a;
  --accent:#8aa4ff; --accent-ink:#0b1230; --accent-soft:#1f2a4d;
  --good:#5fd39a; --good-bg:#17382b; --bad:#ff8f7a; --bad-bg:#3e201a; --warn:#f0c04d; --warn-bg:#3a2f10;
  --rest:#1b2826; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --ink:#e5eeea; --muted:#92a39d; --line:#2a3a37; --soft:#1e2c2a;
  --accent:#8aa4ff; --accent-ink:#0b1230; --accent-soft:#1f2a4d;
  --good:#5fd39a; --good-bg:#17382b; --bad:#ff8f7a; --bad-bg:#3e201a; --warn:#f0c04d; --warn-bg:#3a2f10;
  --rest:#1b2826; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:24px;letter-spacing:-.01em}
.state{font-size:12px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=text],input[type=email],input[type=number],input[type=month],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:4px;font-weight:600;font-size:12px;font-family:var(--f-num)}
.chip.P{background:var(--good-bg);color:var(--good)} .chip.A{background:var(--bad-bg);color:var(--bad)} .chip.R{background:var(--rest);color:var(--muted)} .chip.H{background:var(--warn-bg);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
.why td{white-space:normal;vertical-align:top}.why td.n{white-space:nowrap;min-width:110px}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td small,.muted{color:var(--muted);font-size:12px}
td.name{font-weight:500}
td.name small{display:block;font-weight:400}
tfoot td{font-weight:600;background:var(--soft)}
/* attendance grid */
.grid th,.grid td{padding:0;text-align:center;border-right:1px solid var(--line)}
.grid th.day{min-width:34px;cursor:pointer;padding:5px 0;line-height:1.15}
.grid th.day span{display:block;font-family:var(--f-num);font-size:12px;color:var(--ink)}
.grid th.day small{font-size:10px;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400}
.grid th.day.rest{background:var(--rest)}
.grid .lead{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:7px 10px;min-width:150px;border-right:2px solid var(--line)}
.grid thead .lead{z-index:3}
.grid td.cell{width:34px;height:34px;cursor:pointer;font-family:var(--f-num);font-weight:600;user-select:none;position:relative}
.grid td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.grid td.cell.P{background:var(--good-bg);color:var(--good)}
.grid td.cell.A{background:var(--bad-bg);color:var(--bad)}
.grid td.cell.rest{background:var(--rest);color:var(--muted)}
.grid td.cell.H{background:var(--warn-bg);color:var(--warn)}
.grid td.cell.ov::before{content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.grid td.cell.rv::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.grid td.sum{padding:0 10px;font-family:var(--f-num);font-size:13px;min-width:44px}
.grid td.sum.bad{color:var(--bad)} .grid td.sum.warn{color:var(--warn)}
.grid tfoot td{font-size:12px;font-family:var(--f-num)}
.grid tfoot .lead{background:var(--soft)}
input.num{width:104px;text-align:right;font-family:var(--f-num)}
input.num.hr{width:84px}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 40px var(--surface) inset;-webkit-text-fill-color:var(--ink);caret-color:var(--ink)}
.dedrow{display:flex;gap:8px;align-items:center}
.dedrow .dl{flex:1}
.dedrow .da{width:120px}
.sig{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sig img{max-height:64px;max-width:220px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px}
input.num.missing{border-color:var(--warn);background:var(--warn-bg)}
input.txt{width:100%;min-width:140px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--soft);color:var(--muted);font-weight:500}
.badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.good{background:var(--good-bg);color:var(--good)}
.note{padding:10px 12px;border-radius:6px;background:var(--warn-bg);color:var(--warn);margin-bottom:12px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.card{padding:12px 14px}
.card b{display:block;font-family:var(--f-num);font-size:20px;font-weight:500}
.card span{font-size:12px;color:var(--muted)}
.empty{padding:40px 24px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-size:22px} .empty p{margin:0;max-width:52ch;color:var(--muted)}
.form{display:grid;gap:12px;max-width:640px}
.form.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.field{display:grid;gap:4px} .field label{font-size:12px;font-weight:600;color:var(--muted)} .field .hint{font-size:12px;color:var(--muted)}
.field input,.field select{width:100%}
.settings{display:grid;gap:16px;padding:18px;margin-bottom:16px}
.settings h3{font-size:17px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px}
#modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(10,16,15,.55);z-index:50;overflow:auto;padding:5vh max(12px,env(safe-area-inset-left,0px))}
#modal.open{display:flex}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(760px,100%);display:grid;gap:14px}
.dlg h2{font-size:20px}
.dlg .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;display:none;max-width:90vw;font-size:13px}
@media (max-width:600px){.top{padding-block:12px 8px}.brand h1{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0}
.menu{position:relative;display:inline-block}
.menuList{position:absolute;top:calc(100% + 4px);left:0;z-index:20;min-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:4px;display:grid;white-space:nowrap}
.menuList[hidden]{display:none}
.menuList button{all:unset;cursor:pointer;padding:8px 12px;border-radius:6px;color:var(--ink)}
.menuList button:hover,.menuList button:focus-visible{background:var(--accent-soft);outline:none}
html.locked .app{display:none}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#gate[hidden]{display:none}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(420px,100%)}
.gbox h1{margin:0 0 6px;font-size:22px}
.gbox label{display:block;margin:12px 0;font-weight:500}
.gbox input{display:block;width:100%;margin-top:4px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit}
.gbox .gerr{color:#b42318;min-height:1.4em;margin:6px 0}
.gbox .qr{display:flex;justify-content:center;margin:10px 0}.gbox .qr img{width:200px;height:200px;background:#fff;padding:6px;border-radius:6px}
.gbox code{word-break:break-all;background:var(--soft);padding:2px 5px;border-radius:4px}
input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
#who{margin-left:8px}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Payroll Desk</h1><span class="state" id="saveState"></span><span class="state" id="who"></span><button class="btn sm" data-act="signOut">Sign out</button></div>
    <div class="ctrls">
      <div class="seg" id="partSeg" role="group" aria-label="Pay period">
        <button data-act="part" data-part="week">Week</button>
        <button data-act="part" data-part="first">1–15</button>
        <button data-act="part" data-part="second">16–end</button>
        <button data-act="part" data-part="month">Month</button>
      </div>
      <input type="month" id="monthIn" aria-label="Payroll month">
      <span class="ctrls" id="weekCtl" hidden>
        <button class="btn sm" data-act="shiftWeek" data-dir="-1" aria-label="Previous week">◀</button>
        <label class="muted" for="endIn">Week ending</label>
        <input type="date" id="endIn">
        <button class="btn sm" data-act="shiftWeek" data-dir="1" aria-label="Next week">▶</button>
      </span>
      <select id="siteSel" aria-label="Show employees"></select>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-act="tab" data-tab="attendance">Attendance</button>
    <button role="tab" data-act="tab" data-tab="payroll">Payroll</button>
    <button role="tab" data-act="tab" data-tab="reconcile">Reconciliation</button>
    <button role="tab" data-act="tab" data-tab="employees">Employees</button>
    <button role="tab" data-act="tab" data-tab="settings">Settings</button>
  </nav>
  <main id="view"></main>
</div>
<div id="gate" hidden></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".xls,.xlsx" hidden>
<input type="file" id="restoreIn" accept=".json,application/json" hidden>
<input type="file" id="sigIn" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Su','Mo','Tu','We','Th','Fr','Sa'];
const titleCase=s=>String(s).trim().replace(/\s+/g,' ').replace(/\b([a-z])/g,m=>m.toUpperCase());
const money=n=>{n=Number(n)||0;return (n<0?'-':'')+S.settings.currency+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function lastFriday(){const n=new Date();n.setDate(n.getDate()-((n.getDay()-5+7)%7));return isoOf(n)}

/* ---------- state + storage ---------- */
function defaults(){
  const n=new Date();
  return {employees:[],att:{},review:{},hrs:{},adj:{},locked:{},paid:{},siteFilter:'all',savedAt:0,
    period:{ym:n.getFullYear()+'-'+pad(n.getMonth()+1),part:'week',end:lastFriday()},
    settings:{company:'Eastland Management Consultancy & Ass.',sites:{office:'Office',field:'Site'},currency:'₱',factor:313,restDays:[0],punchRule:'any',hoursPerDay:8,otRate:1,restPremium:false,holidays:false,holidayList:[],fDaily:'rate * days',fMonthly:'max(0, salary * share - absentDays * dailyRate) + restDays * dailyRate',signature:'',signLabel:"Accounting Head's signature"}};
}
function migrate(s){
  if(!s||typeof s!=='object')return null;
  const o=Object.assign(defaults(),s);
  o.settings=Object.assign(defaults().settings,s.settings||{});
  {const sv=(s.settings||{}).sites;o.settings.sites=sv&&Object.keys(sv).length?Object.assign({},sv):{office:'Office',field:'Site'}}
  ['att','review','hrs','adj','locked','paid'].forEach(k=>o[k]=o[k]||{});
  o.employees=o.employees||[];
  o.period=Object.assign({part:'month',end:lastFriday()},o.period||{});
  return o;
}
/* ---------- cloud: configuration, sign-in and database ---------- */
const CFG={url:'https://vilmomebbujnzrdvizur.supabase.co',key:'sb_publishable_aZ5UF-9-vic4hBF051tIgw_pudhkXal'};
const sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const UIKEY='payrolldesk.ui',IDLE_MS=30*60*1000;
const newId=()=>crypto.randomUUID();
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
let pendingRestore=null,S=defaults(),tab='attendance',saveTimer=null,RO=false,me={id:'',email:'',role:''};
function setState(t){const el=$('#saveState');if(el)el.textContent=t}
function uiLoad(){try{const u=JSON.parse(localStorage.getItem(UIKEY)||'null');if(u){if(u.period)S.period=Object.assign(S.period,u.period);if(u.siteFilter)S.siteFilter=u.siteFilter;if(u.tab)tab=u.tab}}catch(e){}}
function uiSave(){try{localStorage.setItem(UIKEY,JSON.stringify({period:S.period,siteFilter:S.siteFilter,tab}))}catch(e){}}

/* tables, keys and order (parents first when writing, children first when deleting) */
const KEYS={locations:['key'],employees:['id'],payroll_paid:['payroll_key'],payroll_locks:['payroll_key'],attendance:['employee_id','work_date'],hour_overrides:['employee_id','work_date'],payroll_adjustments:['payroll_key','employee_id'],payroll_paid_rows:['payroll_key','employee_id'],settings:['id']};
const UP=['locations','employees','payroll_paid','payroll_locks','attendance','hour_overrides','payroll_adjustments','payroll_paid_rows','settings'];
const DOWN=['payroll_paid_rows','payroll_adjustments','hour_overrides','attendance','payroll_locks','payroll_paid','employees','locations'];

function normalize(){
  const T={};UP.forEach(t=>T[t]=new Map());
  const put=(t,row)=>T[t].set(KEYS[t].map(k=>row[k]).join('|'),{r:row,j:JSON.stringify(row)});
  const sites=S.settings.sites||{},ids=new Set(),fallbackLoc=sites.office?'office':(Object.keys(sites)[0]||null);
  for(const k in sites)put('locations',{key:k,name:String(sites[k])});
  S.employees.forEach(e=>{ids.add(e.id);
    put('employees',{id:e.id,name:e.name||'',group_name:e.group||'',bio_id:e.bioId||'',location_key:sites[e.site]?e.site:fallbackLoc,position:e.position||'',wage_type:e.wageType==='monthly'?'monthly':'daily',rate:num(e.rate),deduction:num(e.deduction),address:e.address||'',contact:e.contact||'',email:e.email||'',manager:e.manager||'',active:e.active!==false})});
  const mk=m=>m==='P'||m==='H'||m==='A'?m:null;
  const attIds=new Set([...Object.keys(S.att),...Object.keys(S.review)]);
  attIds.forEach(id=>{if(!ids.has(id))return;const a=S.att[id]||{},r=S.review[id]||{};
    new Set([...Object.keys(a),...Object.keys(r)]).forEach(d=>{const m=mk(a[d]),f=!!r[d];if(m||f)put('attendance',{employee_id:id,work_date:d,mark:m,needs_review:f})})});
  for(const id in S.hrs){if(!ids.has(id))continue;for(const d in S.hrs[id]){const o=S.hrs[id][d];
    put('hour_overrides',{employee_id:id,work_date:d,regular:o.r!=null?num(o.r):null,overtime:num(o.o),sick:num(o.s),vacation:num(o.v)})}}
  for(const pk in S.adj){for(const id in S.adj[pk]){if(!ids.has(id))continue;const a=S.adj[pk][id];
    put('payroll_adjustments',{payroll_key:pk,employee_id:id,rate:a.rate!=null?num(a.rate):null,wage_type:a.type==='monthly'||a.type==='daily'?a.type:null,deductions:(a.ded||[]).map(x=>({l:x.l,a:x.a}))})}}
  for(const pk in S.locked)if(S.locked[pk])put('payroll_locks',{payroll_key:pk});
  for(const pk in S.paid){const P=S.paid[pk];put('payroll_paid',{payroll_key:pk,label:P.label||''});
    for(const id in P.rows){if(!ids.has(id))continue;const r=P.rows[id];
      put('payroll_paid_rows',{payroll_key:pk,employee_id:id,paid_on:r.date||null,reference:r.ref||'',pay:num(r.pay),deductions:num(r.ded),net:num(r.net),by_date:r.by||{}})}}
  const st=Object.assign({},S.settings);delete st.sites;put('settings',{id:1,data:st});
  return T;
}
const toSnap=T=>{const o={};UP.forEach(t=>{o[t]=new Map([...T[t]].map(([k,v])=>[k,v.j]))});return o};

let snap=null,syncing=false,dirty=false,allowBulk=false,retryT=null;
function diff(cur){
  const up={},del={};let delCount=0,upCount=0;
  UP.forEach(t=>{up[t]=[];del[t]=[];
    for(const [k,v] of cur[t])if(snap[t].get(k)!==v.j){up[t].push(v.r);upCount++}
    for(const [k,j] of snap[t])if(!cur[t].has(k)){del[t].push(JSON.parse(j));delCount++}});
  return {up,del,delCount,upCount};
}

/* Formula check and evaluation. Only numbers, + - * / ( ) , and the listed names are allowed. */

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenus()}});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- header ---------- */
function syncHeader(){
  const p=S.period;
  $('#monthIn').value=p.ym;$('#monthIn').hidden=p.part==='week';
  $('#weekCtl').hidden=p.part!=='week';$('#endIn').value=p.end;
  document.querySelectorAll('#partSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.part===p.part));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  const groups=[...new Set(S.employees.map(e=>(e.group||'').trim()).filter(Boolean))].sort();
  const sel=$('#siteSel');
  sel.innerHTML='<option value="all">All Location</option>'+Object.keys(S.settings.sites).map(k=>'<option value="'+esc(k)+'">'+esc(siteName(k))+'</option>').join('');
  sel.value=S.siteFilter;if(sel.value!==S.siteFilter){S.siteFilter='all';sel.value='all'}
}

/* ---------- views ---------- */
function render(){
  syncHeader();
  const v=$('#view');
  if(tab==='attendance')v.innerHTML=viewAttendance();
  else if(tab==='payroll')v.innerHTML=viewPayroll();
  else if(tab==='reconcile')v.innerHTML=viewReconcile();
  else if(tab==='employees')v.innerHTML=viewEmployees();
  else v.innerHTML=viewSettings();
}
function emptyState(imp){
  return '<div class="panel empty"><h2>Start with your biometric report</h2><p>Upload the .xls file from the biometric software. Employees and their present or absent days are filled in for you. Staff at the manual site are added by hand and marked with a click.</p>'+
  '<div class="bar">'+(imp?'<button class="btn primary" data-act="import">IMPORT BIOMETRICS</button><button class="btn" data-act="addEmp">Add an employee</button>':'<button class="btn primary" data-act="addEmp">Add an employee</button><button class="btn" data-act="tab" data-tab="attendance">Go to Attendance to import</button>')+'</div></div>';
}
function lockedBanner(){return S.locked[pKey()]?'<div class="note">This payroll is locked. Open the Payroll tab and choose Unlock to change it.</div>':''}

function viewAttendance(){
  if(!S.employees.length)return emptyState(true);
  const dates=periodDates(),emps=visibleEmps(),H=S.settings.hoursPerDay;
  const head=dates.map(d=>'<th class="day'+(isWork(d)?'':' rest')+'" data-act="dayHead" data-d="'+d+'" title="Mark everyone present on this day"><span>'+d.slice(8)+'</span><small>'+DOW[dowOf(d)]+'</small></th>').join('');
  let rows='';
  for(const e of emps){
    const at=S.att[e.id]||{},rv=S.review[e.id]||{},ov=S.hrs[e.id]||{};
    const cells=dates.map(d=>{const v=at[d],w=isWork(d);
      return '<td class="cell '+(v||(w?'':'rest'))+(rv[d]?' rv':'')+(ov[d]?' ov':'')+'" data-act="cell" data-e="'+e.id+'" data-d="'+d+'">'+(v==='H'?'½':v||(w?'':'·'))+'</td>'}).join('');
    const c=calc(e);
    rows+='<tr><td class="lead"><b>'+esc(e.name)+'</b><br><small class="muted">'+esc(e.group||siteName(e.site))+'</small></td>'+cells+
      '<td class="sum">'+fd(c.reg/H)+'</td><td class="sum bad">'+(c.absent||'')+'</td><td class="sum warn">'+(c.unmarked||'')+'</td>'+
      '<td class="sum"><button class="btn sm" data-act="rowAll" data-e="'+e.id+'">All present</button> <button class="btn sm" data-act="hours" data-e="'+e.id+'">Hours</button></td></tr>';
  }
  const foot=dates.map(d=>{let n=0;emps.forEach(e=>{if(dayHrs(e,d).r>0)n++});return '<td>'+(n||'')+'</td>'}).join('');
  return lockedBanner()+
  '<div class="bar"><button class="btn primary" data-act="import">IMPORT BIOMETRICS</button>'+
  '<button class="btn" data-act="markAll">Mark all unmarked days present</button><span class="grow"></span>'+
  '<div class="legend"><span><span class="chip P">P</span> present ('+H+' hrs)</span><span><span class="chip H">½</span> half day</span><span><span class="chip A">A</span> absent</span><span><span class="chip R">·</span> rest day (OFF)</span><span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent)"></span> custom hours</span><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn)"></span> one punch only</span></div></div>'+
  '<div class="panel scroll"><table class="grid"><thead><tr><th class="lead">Employee</th>'+head+'<th>Days</th><th>Absent</th><th>Unmarked</th><th></th></tr></thead><tbody>'+rows+'</tbody>'+
  '<tfoot><tr><td class="lead">Working per day</td>'+foot+'<td colspan="4"></td></tr></tfoot></table></div>'+
  '<p class="muted" style="margin-top:10px">Click a day to cycle present, half day, absent, blank. Click a date at the top to mark everyone present that day. Use Hours to type overtime, sick or vacation hours. A rest day left blank prints OFF on the payslip.</p>';
}

function viewPayroll(){
  if(!S.employees.length)return emptyState();
  const emps=visibleEmps(),locked=!!S.locked[pKey()],dis=locked?' disabled':'',paidRows=(S.paid[pKey()]||{}).rows||{},nPaid=emps.filter(e=>paidRows[e.id]).length;
  const chg=emps.filter(e=>paidRows[e.id]&&Math.abs(paidRows[e.id].net-calc(e).net)>0.005);
  const T={reg:0,ot:0,sick:0,vac:0,gross:0,ded:0,net:0};let unm=0,rows='';
  for(const e of emps){
    const c=calc(e);T.reg+=c.reg;T.ot+=c.ot;T.sick+=c.sick;T.vac+=c.vac;T.gross+=c.gross;T.ded+=c.dedTotal;T.net+=c.net;unm+=c.unmarked;
    rows+='<tr data-e="'+e.id+'"><td class="name">'+esc(e.name)+(paidRows[e.id]?' <span class="badge good" title="'+esc('Paid '+fmtUS(paidRows[e.id].date)+(paidRows[e.id].ref?' · '+paidRows[e.id].ref:''))+'">Paid '+esc(fmtMD(paidRows[e.id].date))+'</span>':'')+(paidRows[e.id]&&Math.abs(paidRows[e.id].net-c.net)>0.005?' <span class="badge warn" title="'+esc('Paid '+money(paidRows[e.id].net)+', now '+money(c.net))+'">Changed since paid</span>':'')+(c.unmarked?' <span class="badge warn" title="Working days not marked pay nothing">'+c.unmarked+' unmarked</span>':'')+'<small>'+esc(e.group||siteName(e.site))+' · '+(c.type==='daily'?'Daily wage':'Monthly salary')+'</small></td>'+
    '<td><input class="num'+(c.edited?' edited':'')+(c.rate?'':' missing')+'" type="number" step="0.01" min="0" inputmode="decimal" data-f="rate" value="'+c.rate+'" aria-label="Rate for '+esc(e.name)+'"'+dis+(c.edited?' title="Changed for this payroll only"':'')+'><small class="muted" data-c="hourly" style="display:block;text-align:right">'+money(c.hourly)+' / hr</small></td>'+
    '<td class="n" data-c="reg">'+fh(c.reg)+'</td><td class="n" data-c="ot">'+fh(c.ot)+'</td><td class="n" data-c="sick">'+fh(c.sick)+'</td><td class="n" data-c="vac">'+fh(c.vac)+'</td>'+
    '<td class="n" data-c="gross">'+money(c.gross)+'</td>'+
    '<td class="n"><button class="btn sm" data-act="ded" data-e="'+e.id+'"'+dis+' data-c="ded">'+(c.dedTotal?money(c.dedTotal):'Add')+'</button></td>'+
    '<td class="n" data-c="net"><b>'+money(c.net)+'</b></td>'+
    '<td><button class="btn sm" data-act="why" data-e="'+e.id+'">Computation</button> <button class="btn sm" data-act="hours" data-e="'+e.id+'"'+dis+'>Hours</button> <button class="btn sm" data-act="slip" data-e="'+e.id+'">Payslip JPG</button></td></tr>';
  }
  return '<div class="cards"><div class="panel card"><b>'+emps.length+'</b><span>Employees · '+esc(periodLabel())+' · Pay day '+esc(fmtUS(payDefault()))+'</span></div>'+
    '<div class="panel card"><b id="totNetCard">'+money(T.net)+'</b><span>Total net pay</span></div>'+
    '<div class="panel card"><b>'+(unm?'<span style="color:var(--warn)">'+unm+'</span>':'0')+'</b><span>Unmarked working days</span></div></div>'+
  (chg.length?'<div class="note"><b>This payroll changed after it was paid.</b> '+chg.length+' employee'+(chg.length===1?'':'s')+' now compute differently from the amounts recorded as paid, usually because attendance was updated or re-imported. The paid amounts are kept. Check the Reconciliation tab for the difference.</div>':'')+
  (S.period.part==='week'&&dowOf(S.period.end)!==5?'<div class="note">Weekly pay is released on Fridays, but this week ends on a '+DAYN[dowOf(S.period.end)]+'. Pick the Friday that matches your pay day.</div>':'')+
  '<div class="bar">'+menuHTML('sum','PAYROLL SUMMARY',false)+menuHTML('zip','PAYSLIP (ZIP)',false)+'<button class="btn" data-act="excel">Excel</button><span class="grow"></span>'+
  '<button class="btn" data-act="'+(nPaid&&nPaid===emps.length?'unpay':'markPaid')+'">'+(nPaid&&nPaid===emps.length?'Undo payment':'Mark as paid')+'</button> <button class="btn" data-act="lock">'+(locked?'Unlock this payroll':'Lock this payroll')+'</button></div>'+
  (locked?'<div class="note">Locked. Rates and deductions are saved as they are now, even if you later change an employee\'s salary.</div>':'')+
  '<div class="panel scroll"><table><thead><tr><th>Employee</th><th class="n">Rate</th><th class="n">Regular hrs</th><th class="n">OT hrs</th><th class="n">Sick</th><th class="n">Vacation</th><th class="n">Gross pay</th><th class="n">Deductions</th><th class="n">Net pay</th><th></th></tr></thead><tbody>'+rows+
  '</tbody><tfoot><tr><td>Total</td><td></td><td class="n" id="tReg">'+fh(T.reg)+'</td><td class="n" id="tOt">'+fh(T.ot)+'</td><td class="n" id="tSick">'+fh(T.sick)+'</td><td class="n" id="tVac">'+fh(T.vac)+'</td><td class="n" id="tGross">'+money(T.gross)+'</td><td class="n" id="tDed">'+money(T.ded)+'</td><td class="n" id="tNet">'+money(T.net)+'</td><td></td></tr></tfoot></table></div>'+
  '<p class="muted" style="margin-top:10px">Rate is per day for daily wage, or per month for monthly salary. Rate per hour is the daily rate divided by '+S.settings.hoursPerDay+' hours. Overtime is paid at '+S.settings.otRate+' times the hourly rate. Editing a rate here changes this payroll only. Change it for good in the Employees tab.</p>';
}
function refreshPayroll(){
  const T={reg:0,ot:0,sick:0,vac:0,gross:0,ded:0,net:0};
  for(const e of visibleEmps()){const c=calc(e);T.reg+=c.reg;T.ot+=c.ot;T.sick+=c.sick;T.vac+=c.vac;T.gross+=c.gross;T.ded+=c.dedTotal;T.net+=c.net;
    const tr=document.querySelector('tr[data-e="'+e.id+'"]');if(!tr)continue;
    tr.querySelector('[data-c=gross]').textContent=money(c.gross);tr.querySelector('[data-c=net]').innerHTML='<b>'+money(c.net)+'</b>';
    tr.querySelector('[data-c=hourly]').textContent=money(c.hourly)+' / hr';
    const r=tr.querySelector('[data-f=rate]');r.classList.toggle('edited',c.edited);r.classList.toggle('missing',!c.rate)}
  const set=(id,v,h)=>{const el=$(id);if(el)el.textContent=h?fh(v):money(v)};
  set('#tReg',T.reg,1);set('#tOt',T.ot,1);set('#tSick',T.sick,1);set('#tVac',T.vac,1);set('#tGross',T.gross);set('#tDed',T.ded);set('#tNet',T.net);set('#totNetCard',T.net);
}

let empMode=null,empSel=new Set();
function viewEmployees(){
  const q=(window.__q||'').toLowerCase();
  const f=S.siteFilter,inF=e=>f==='all'||((S.settings.sites[f]!==undefined)?e.site===f:('g:'+(e.group||''))===f);
  const list=S.employees.filter(e=>inF(e)&&(!q||(e.name+' '+(e.position||'')+' '+(e.group||'')+' '+(e.bioId||'')).toLowerCase().includes(q))).sort((a,b)=>(a.group||'').localeCompare(b.group||'')||a.name.localeCompare(b.name));
  const rows=list.map(e=>'<tr data-e="'+e.id+'">'+(empMode?'<td><input type="checkbox" data-sel="'+e.id+'"'+(empSel.has(e.id)?' checked':'')+' aria-label="Select '+esc(e.name)+'"></td>':'')+'<td class="name">'+esc(e.name)+'<small>'+esc(e.position||'')+(e.bioId?(e.position?' · ':'')+'Biometric ID '+esc(e.bioId):'')+'</small></td>'+
    '<td>'+esc(e.group||'')+'</td><td>'+esc(siteName(e.site))+'</td>'+
    '<td><select data-ef="wageType" aria-label="Wage type"><option value="daily"'+(e.wageType==='daily'?' selected':'')+'>Daily wage</option><option value="monthly"'+(e.wageType==='monthly'?' selected':'')+'>Monthly salary</option></select></td>'+
    '<td><input class="num'+(e.rate?'':' missing')+'" type="number" step="0.01" min="0" inputmode="decimal" data-ef="rate" value="'+e.rate+'" aria-label="Salary rate for '+esc(e.name)+'"></td>'+
    '<td>'+(e.active===false?'<span class="badge">Inactive</span>':'<span class="badge good">Active</span>')+'</td>'+
    '</tr>').join('');
  const nSel=empSel.size,mb=empMode?'<div class="note" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span>'+(empMode==='edit'?'Tick the employee you want to edit.':'Tick the employees you want to delete.')+'</span><span class="grow"></span>'+(empMode==='edit'?'<button class="btn primary sm" data-act="empGo"'+(nSel?'':' disabled')+'>Edit selected</button>':'<button class="btn danger sm" data-act="empGo"'+(nSel?'':' disabled')+'>Delete selected'+(nSel?' ('+nSel+')':'')+'</button>')+'<button class="btn sm" data-act="empCancel">Cancel</button></div>':'';
  return '<div class="bar"><button class="btn primary" data-act="addEmp">Add employee</button><button class="btn" data-act="empMode" data-m="edit" aria-pressed="'+(empMode==='edit')+'">Edit Employee</button><button class="btn danger" data-act="empMode" data-m="del" aria-pressed="'+(empMode==='del')+'">Delete</button><span class="grow"></span><input type="search" id="empSearch" placeholder="Search employees" value="'+esc(window.__q||'')+'" aria-label="Search employees"></div>'+
  mb+(S.employees.some(e=>!e.rate)?'<div class="note">Some employees have no rate yet. Type their daily or monthly rate in the highlighted boxes.</div>':'')+
  (S.employees.length&&!list.length&&!q?'<div class="note">No employees in '+esc(filterLabel())+'. Choose All Location above to see everyone.</div>':'')+
  (S.employees.length?'<div class="panel scroll"><table><thead><tr>'+(empMode?'<th>'+(empMode==='del'?'<input type="checkbox" id="selAll" aria-label="Select or clear all listed employees"'+(list.length&&list.every(e=>empSel.has(e.id))?' checked':'')+'>':'')+'</th>':'')+'<th>Employee</th><th>Group on payslip</th><th>Location</th><th>Wage type</th><th class="n">Rate (per day or per month)</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    :emptyState())+
  '<p class="muted" style="margin-top:10px">A new rate applies to payrolls you have not locked. Locked payrolls keep the rate they were locked with.</p>';
}

/* ---------- payment runs + monthly reconciliation ---------- */
function payDefault(){
  const p=S.period,{y,m}=ymParts(p.ym),dim=new Date(y,m,0).getDate();
  if(p.part==='week')return p.end;if(p.part==='first')return p.ym+'-15';return p.ym+'-'+pad(dim);
}
function recordPaid(date,ref){
  const pk=pKey();
  if(!S.locked[pk]){S.adj[pk]=S.adj[pk]||{};
    visibleEmps().forEach(e=>{const a=adjOf(e);S.adj[pk][e.id]=Object.assign(S.adj[pk][e.id]||{},{rate:a.rate,type:a.type,ded:a.ded.map(x=>({l:x.l,a:x.a}))})});
    S.locked[pk]=true}
  const P=S.paid[pk]=S.paid[pk]||{label:periodLabel(),rows:{}},r4=n=>Math.round(n*1e4)/1e4;
  visibleEmps().forEach(e=>{const c=calc(e),by={};for(const d in c.by)by[d]=r4(c.by[d]);
    P.rows[e.id]={date,ref,pay:r4(c.gross+c.payOt+c.paySick+c.payVac),ded:r4(c.dedTotal),net:r4(c.net),by}});
  save();
}
let recYm=null;
function viewReconcile(){
  if(!S.employees.length)return emptyState();
  const ym=recYm||S.period.ym,dates=datesOf(ym,'month'),emps=visibleEmps(),T={earned:0,paid:0,bal:0,net:0};let rows='';
  for(const e of emps){
    const c=calcCore(e,dates,{rate:e.rate,type:e.wageType,ded:[]},'month'),earned=dates.reduce((t,d)=>t+c.by[d],0);
    let paidFor=0,netIn=0;
    for(const pk in S.paid){const r=S.paid[pk].rows[e.id];if(!r)continue;for(const d in r.by)if(d.slice(0,7)===ym)paidFor+=r.by[d];if(r.date.slice(0,7)===ym)netIn+=r.net}
    const bal=earned-paidFor;T.earned+=earned;T.paid+=paidFor;T.bal+=bal;T.net+=netIn;
    const st=Math.abs(bal)<0.005?'<span class="badge good">Settled</span>':bal>0?'<span class="badge warn">Still due</span>':'<span class="badge warn">Overpaid</span>';
    rows+='<tr><td class="name">'+esc(e.name)+(c.unmarked?' <span class="badge warn" title="Working days not marked">'+c.unmarked+' unmarked</span>':'')+'<small>'+esc(e.group||siteName(e.site))+' · '+(e.wageType==='daily'?'Daily wage':'Monthly salary')+'</small></td>'+
      '<td class="n">'+money(earned)+'</td><td class="n">'+money(paidFor)+'</td><td class="n"><b>'+money(bal)+'</b></td><td class="n">'+money(netIn)+'</td><td>'+st+'</td></tr>';
  }
  const runs={};
  for(const pk in S.paid){const P=S.paid[pk];for(const id in P.rows){const r=P.rows[id];if(r.date.slice(0,7)!==ym)continue;
    const k=r.date+'|'+pk+'|'+(r.ref||'');(runs[k]=runs[k]||{date:r.date,label:P.label,ref:r.ref||'',n:0,net:0});runs[k].n++;runs[k].net+=r.net}}
  const rr=Object.values(runs).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>'<tr><td>'+esc(fmtUS(r.date))+'</td><td>'+esc(r.label)+'</td><td>'+esc(r.ref)+'</td><td class="n">'+r.n+'</td><td class="n">'+money(r.net)+'</td></tr>').join('');
  const [yy,mm]=ym.split('-');
  return '<div class="bar"><label class="muted" for="recMonth">Month</label><input type="month" id="recMonth" value="'+ym+'" aria-label="Month to reconcile"><span class="grow"></span></div>'+
  '<div class="cards"><div class="panel card"><b>'+money(T.earned)+'</b><span>Earned for '+esc(MONTHS[+mm-1])+' '+yy+'</span></div><div class="panel card"><b>'+money(T.paid)+'</b><span>Paid for this month\'s work</span></div><div class="panel card"><b>'+money(T.bal)+'</b><span>Balance still due</span></div></div>'+
  '<div class="panel scroll"><table><thead><tr><th>Employee</th><th class="n">Earned this month</th><th class="n">Paid for this month\'s work</th><th class="n">Balance</th><th class="n">Net paid on dates in this month</th><th>Status</th></tr></thead><tbody>'+rows+
  '</tbody><tfoot><tr><td>Total</td><td class="n">'+money(T.earned)+'</td><td class="n">'+money(T.paid)+'</td><td class="n">'+money(T.bal)+'</td><td class="n">'+money(T.net)+'</td><td></td></tr></tfoot></table></div>'+
  '<h3 style="margin:18px 0 8px;font-size:16px">Payments recorded in this month</h3>'+
  (rr?'<div class="panel scroll"><table><thead><tr><th>Payment date</th><th>Period</th><th>Reference</th><th class="n">Employees</th><th class="n">Net paid</th></tr></thead><tbody>'+rr+'</tbody></table></div>':'<p class="muted">No payments recorded for this month yet. Use Mark as paid in the Payroll tab.</p>')+
  '<p class="muted" style="margin-top:10px">Earned uses each employee\'s current rate and every attendance day in the month. Each weekly or semi-monthly payment is matched to the days it paid for, so a week that crosses a month end counts toward both months. Work on Oct 31 stays due until the run that pays it is marked paid. Deductions and allowances are in the net amounts, not in the balance.</p>';
}

/* Step by step working of one person's pay for the period on screen. */
function whyForm(e){
  const c=calc(e),s=S.settings,H=s.hoursPerDay,L=[];
  const add=(t,v,n)=>L.push('<tr><td>'+t+(n?'<div class="muted" style="font-size:12px">'+n+'</div>':'')+'</td><td class="n">'+v+'</td></tr>');
  add('Pay type',c.monthly?'Monthly':'Daily');
  add('Rate',money(c.rate),c.monthly?'Monthly salary':'Per day');
  if(c.monthly){
    add('Salary for this period',money(c.rate*c.frac),c.frac===1?'Full month':'Rate × '+(c.frac===.5?'1/2':fh(c.frac))+(S.period.part==='week'?' ('+c.workDays+' working days ÷ '+((s.factor||313)/12).toFixed(2)+')':''));
    add('Daily equivalent',money(c.eqDay),'Salary × 12 ÷ '+(s.factor||313)+' = salary ÷ '+((s.factor||313)/12).toFixed(2)+' (Settings: Factor for monthly salary)');
    add('Absent day equivalents',fd(c.absEq),'Absent = 1, half day = 0.5');
    const cov=(c.sick+c.vac)/H;if(cov)add('Covered by sick/vacation',fd(cov)+' days');
    add('Absence deduction','-'+money(Math.max(0,c.absEq-cov)*c.eqDay),fd(Math.max(0,c.absEq-cov))+' days × '+money(c.eqDay));
    if(c.restEq)add((S.settings.restPremium||S.settings.holidays)?'Rest day and holiday work':'Rest days worked','+'+money(c.restEq*c.eqDay),fh(c.restEq)+' day equivalents × '+money(c.eqDay)+(S.settings.restPremium||S.settings.holidays?' (premium rates from Settings)':''));
  }else{
    if(S.settings.restPremium||S.settings.holidays)add('Paid day equivalents',fh(c.days),'Includes rest day and holiday rates set in Settings');
    add('Regular hours',fh(c.reg),'Present = '+H+' hours, half day = '+H/2+' (Settings: Regular hours in one day)');
    add('Hourly rate',money(c.hourly),'Day rate ÷ '+H+' hours');
  }
  add('Gross pay',money(c.gross),'Formula: '+esc(c.formula)+'<br>'+esc(Object.entries(c.vars).map(([k,v])=>k+' = '+(+v.toFixed(4))).join(', '))+' (Settings: Pay formulas)');
  if(c.ot)add('Overtime','+'+money(c.payOt),fh(c.ot)+' hours × '+money(c.hourly)+' × '+s.otRate+' (Settings: Overtime pay multiplier)');
  if(c.paySick)add('Sick leave pay','+'+money(c.paySick),fh(c.sick)+' hours × '+money(c.hourly));
  if(c.payVac)add('Vacation leave pay','+'+money(c.payVac),fh(c.vac)+' hours × '+money(c.hourly));
  c.ded.forEach(x=>add('Deduction: '+esc(x.l||'(no label)'),'-'+money(num(x.a))));
  add('<b>Net pay</b>','<b>'+money(c.net)+'</b>','Gross + overtime + leave pay − deductions');
  const pr=((S.paid[pKey()]||{}).rows||{})[e.id];
  openModal('<h2>Computation: '+esc(e.name)+'</h2><div class="muted">'+esc(periodLabel())+'</div><div class="scroll" style="max-height:55vh"><table class="why"><tbody>'+L.join('')+'</tbody></table></div>'+
    (pr?'<div class="note">Recorded as paid: '+money(pr.net)+(Math.abs(pr.net-c.net)>0.005?'. Today\'s computation is different.':'.')+'</div>':'')+
    '<p class="muted" style="margin:8px 0 0">The rate and deductions are changed per person (Edit, Deductions). The hours, overtime and factor are in Settings.</p>'+
    '<div class="actions"><button class="btn" data-act="closeModal">Close</button><button class="btn primary" data-act="goSettings">Open pay rules</button></div>');
}

/* ---------- biometric import ---------- */
function sheetToMatrix(ws){
  const rng=XLSX.utils.decode_range(ws['!ref']||'A1'),m=[];
  for(let r=0;r<=rng.e.r;r++){const row=[];for(let c=0;c<=rng.e.c;c++){const cell=ws[XLSX.utils.encode_cell({r,c})];row.push(cell?cell.v:null)}m.push(row)}
  return m;
}
const hhmm=f=>{if(typeof f!=='number')return String(f);const m=Math.round(f*1440);return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
/* Reads the "Time Card" sheets: three employees per sheet, each block 15 columns wide. */
function parseTimeCards(sheets){
  let range=null;const emps=[];
  for(const sh of sheets){
    const R=sh.rows;
    if(!range){for(const row of R){for(const v of row){if(typeof v==='string'){const m=v.match(/(\d{4})-(\d{2})-(\d{2})\s*~\s*(\d{4})-(\d{2})-(\d{2})/);if(m){range={start:m[1]+'-'+m[2]+'-'+m[3],end:m[4]+'-'+m[5]+'-'+m[6]};break}}}if(range)break}}
    const hdr=R[3]||[];
    for(let c=0;c<hdr.length;c++){
      if(String(hdr[c]==null?'':hdr[c]).trim()!=='Name')continue;
      const start=c-8,name=hdr[c+1],id=(R[4]||[])[c+1];
      if(start<0||!name||!String(name).trim())continue;
      const days=[];
      for(let r=12;r<R.length;r++){
        const m=String(R[r][start]==null?'':R[r][start]).match(/^\s*(\d{1,2})\s+([A-Za-z]{2})/);
        if(!m){if(days.length)break;else continue}
        const p=[];for(let k=start+1;k<=start+13;k++){const v=R[r][k];if(v!=null&&String(v).trim()!=='')p.push(v)}
        days.push({day:+m[1],wd:m[2],n:p.length,first:p.length?hhmm(p[0]):'',last:p.length?hhmm(p[p.length-1]):''});
      }
      emps.push({bio:String(id==null?'':id).trim(),name:titleCase(name),days});
    }
  }
  return {range,employees:emps};
}
function statusMap(pe,ym){
  const {y,m}=ymParts(ym),dim=new Date(y,m,0).getDate(),out={},rv={};let p=0,a=0,one=0;
  for(const d of pe.days){
    if(d.day>dim)continue;const iso=ym+'-'+pad(d.day),work=isWork(iso);
    const ok=S.settings.punchRule==='both'?d.n>=2:d.n>=1;
    if(work)out[iso]=ok?'P':'A';else out[iso]=ok?'P':null;
    if(d.n===1){rv[iso]=1;one++}
    if(out[iso]==='P')p++;else if(out[iso]==='A')a++;
  }
  return {out,rv,present:p,absent:a,single:one};
}

/* Finds ticked people whose imported days would change a day already counted in a paid payroll. */
function paidConflicts(){
  const out={};
  for(const o of pending.rows){if(!o.on||!o.ex)continue;const e=o.ex,s=statusMap(o.pe,pending.ym);
    for(const pk in S.paid){const r=S.paid[pk].rows[e.id];if(!r)continue;
      for(const d in s.out){if(!(d in r.by))continue;
        const cur=(S.att[e.id]||{})[d]||null,nw=s.out[d]||null;
        if(cur!==nw||(S.hrs[e.id]||{})[d]){const k=out[pk]=out[pk]||{label:S.paid[pk].label,ids:new Set()};k.ids.add(e.id);break}}}}
  return Object.values(out);
}

function applyImport(){
  const {rows,ym}=pending,t=$('#imp_type').value;let made=0,done=0;

    if(!e){e={id:newId(),name:o.pe.name,bioId:o.pe.bio,site:'office',group:'',position:'',wageType:t,rate:0,deduction:0,active:true};S.employees.push(e);made++}
    else if(!e.bioId&&o.pe.bio)e.bioId=o.pe.bio;
    const s=statusMap(o.pe,ym);S.att[e.id]=S.att[e.id]||{};S.review[e.id]=S.review[e.id]||{};
    for(const d in s.out){if(S.hrs[e.id])delete S.hrs[e.id][d];if(s.out[d])S.att[e.id][d]=s.out[d];else delete S.att[e.id][d];if(s.rv[d])S.review[e.id][d]=1;else delete S.review[e.id][d]}
    done++;
  }
  S.period={ym,part:'month',end:S.period.end};tab=made?'employees':'attendance';save();closeModal();render();
  toast('Imported '+done+' people'+(made?'. '+made+' new. Set their rates below.':''));
}

    [['Day',0,2],['Regular|hours',2,3],['Overtime|hours',3,4],['Sick',4,5],['Vacation',5,6],['Total',6,7]].forEach(([t,a,b])=>{
      box(xs[a],y,xs[b],y+46,HEAD);const L=t.split('|'),cx=(xs[a]+xs[b])/2;
      if(L.length>1){txt(L[0],cx,y+20,'600 13px '+SANS,'#fff','center');txt(L[1],cx,y+37,'600 13px '+SANS,'#fff','center')}else txt(t,cx,y+27,'600 13px '+SANS,'#fff','center')});
    y+=46;
    dates.forEach((d,i)=>{const h=dayHrs(e,d),f=i%2?ZB:'#fff',g=i%2?G2:G1,w=isWork(d);
      box(xs[0],y,xs[1],y+30,f);box(xs[1],y,xs[2],y+30,f);[2,3,4,5].forEach(k=>box(xs[k],y,xs[k+1],y+30,f));box(xs[6],y,xs[7],y+30,g);
      ctr(DAYN[dowOf(d)],xs[0],xs[1],y,y+30,'13px '+SANS);ctr(fmtMD(d),xs[1],xs[2],y,y+30,'13px '+SANS);
      [h.r,h.o,h.s,h.v].forEach((v,k)=>{let s=v>0?v.toFixed(2):'',font='13px '+SANS;if(k===0&&!v&&!w){s='OFF';font='600 13px '+SANS}if(s)ctr(s,xs[k+2],xs[k+3],y,y+30,font)});
      ctr((h.r+h.o+h.s+h.v).toFixed(2),xs[6],xs[7],y,y+30,'13px '+SANS);y+=30});
    y+=30;
    const row=(label,align,fills,vals,opt)=>{opt=opt||{};const f=(opt.b?'600 ':'')+'13px '+SANS;
      box(xs[0],y,xs[2],y+30,opt.lf||'#fff');
      if(align==='c')ctr(label,xs[0],xs[2],y,y+30,f);else txt(label,xs[0]+3,y+20,f,INK,'left',170);
      for(let k=0;k<5;k++){const a=xs[k+2],b=xs[k+3];box(a,y,b,y+30,fills[k]);if(vals[k])ctr(vals[k],a,b,y,y+30,f)}
      y+=30};
    row('Total hours','c',['#fff','#fff','#fff','#fff',G2],[fh(c.reg),fh(c.ot),fh(c.sick),fh(c.vac),fh(c.reg+c.ot+c.sick+c.vac)]);
    row('Rate per hour','c',[ZB,ZB,ZB,ZB,G1],[money(c.hourly)],{lf:ZB});
    row('Gross pay','l',[G2,G2,G2,G2,G1],[money(c.gross)],{lf:G2});
    if(!c.ded.length)row('Deductions:','l',[ZB,ZB,ZB,ZB,G1],[],{lf:ZB});
    c.ded.forEach((ln,i)=>row(i===0?'Deductions:'+(ln.l?'    '+ln.l:''):(ln.l||''),'l',[ZB,ZB,ZB,ZB,G1],[ln.a?money(ln.a):''],{lf:ZB}));
    row('Total pay','c',[G2,G2,G2,G2,G2],[money(c.gross-c.dedTotal),money(c.payOt),money(c.paySick),money(c.payVac),money(c.net)],{lf:G2,b:true});
    const yl=y+78;
    txt(fmtUS(dates[dates.length-1]),651,yl-23,'13px '+SANS,INK);
    if(sig){const r=Math.min(150/sig.width,92/sig.height),w=sig.width*r,h=sig.height*r;x.drawImage(sig,485,y+101-h,w,h)}
    hl(470,735,yl,TT);
    const sl='13px '+SANS;
        txt(S.settings.signLabel||"Accounting Head's signature",557,yl+16,sl,INK,'center',180);txt('Date',694,yl+16,sl,INK,'center');
    rect(115,y+129,735,y+139,TEAL);
    return Math.max(1100,y+139+84);
  };
}
async function slipBlob(e){const sig=await loadSig();return jpg(makeCanvas(850,drawSlip(e,sig)))}
async function slipJpg(e){saveFile('payslip-'+slug(e.name)+'-'+pTag()+'.jpg',await slipBlob(e))}
async function allSlips(){
  if(typeof JSZip==='undefined')return toast('The ZIP tool did not load. Check your internet connection and reload.');
  const emps=ofType(visibleEmps(),zipType);if(!emps.length)return toast('No employees with this wage type to export.');
  toast('Building '+emps.length+' payslips…');const z=new JSZip();
  for(const e of emps)z.file('payslip-'+slug(e.name)+'.jpg',await slipBlob(e));
  saveFile('payslips-'+pTag()+typeTag(zipType)+(S.siteFilter==='all'?'':'-'+slug(filterLabel()))+'.zip',await z.generateAsync({type:'blob'}));
}
async function summaryJpg(){
  await fonts();const emps=ofType(visibleEmps(),sumType);if(!emps.length)return toast('No employees with this wage type to export.');
  const rows=emps.map(e=>({e,c:calc(e)})),T={reg:0,ot:0,gross:0,ded:0,net:0};
  rows.forEach(r=>{T.reg+=r.c.reg;T.ot+=r.c.ot;T.gross+=r.c.gross;T.ded+=r.c.dedTotal;T.net+=r.c.net});
  const cv=makeCanvas(1400,(x,W)=>{
    const P=40,rh=38;let y;
    x.fillStyle='#1c3a8c';x.fillRect(0,0,W,100);x.fillStyle='#fff';x.textAlign='left';x.font=FS(600,28);x.fillText(S.settings.company,P,48);x.font=FS(400,16);
    x.fillText('Payroll summary · '+periodLabel()+(sumType==='all'?'':' · '+(sumType==='daily'?'Daily wage':'Monthly salary'))+(S.siteFilter!=='all'?' · '+filterLabel():''),P,78);
    y=140;const xs=[P,330,560,690,790,950,1100,W-P],heads=['Employee','Group','Rate','Regular hrs','OT hrs','Gross pay','Deductions','Net pay'];
    x.fillStyle='#5b6a65';x.font=FS(600,12);heads.forEach((h,i)=>{x.textAlign=i<2?'left':'right';x.fillText(h.toUpperCase(),xs[i],y)});
    x.strokeStyle='#17211e';x.beginPath();x.moveTo(P,y+10);x.lineTo(W-P,y+10);x.stroke();y+=rh;
    rows.forEach((r,i)=>{if(i%2){x.fillStyle='#f3f6f5';x.fillRect(P-8,y-24,W-2*P+16,rh)}
      x.fillStyle='#17211e';x.textAlign='left';x.font=FS(500,16);x.fillText(r.e.name,P,y,280);x.font=FS(400,14);x.fillText(r.e.group||'',xs[1],y,220);
      x.font=FM(400,14);x.textAlign='right';
      [money(r.c.rate)+(r.c.type==='daily'?'/day':'/mo'),fh(r.c.reg),fh(r.c.ot),money(r.c.gross),money(r.c.dedTotal)].forEach((t,k)=>x.fillText(t,xs[k+2],y));
      x.font=FM(500,15);x.fillText(money(r.c.net),xs[7],y);y+=rh});
    x.strokeStyle='#17211e';x.beginPath();x.moveTo(P,y-20);x.lineTo(W-P,y-20);x.stroke();y+=10;
    x.font=FS(600,16);x.textAlign='left';x.fillText('TOTAL',P,y);x.font=FM(500,15);x.textAlign='right';
    [fh(T.reg),fh(T.ot),money(T.gross),money(T.ded)].forEach((t,k)=>x.fillText(t,xs[k+3],y));x.fillStyle='#1c3a8c';x.font=FM(500,18);x.fillText(money(T.net),xs[7],y);
    return y+50;
  });
  saveFile('payroll-summary-'+pTag()+typeTag(sumType)+'.jpg',await jpg(cv));
}
function excelOut(){
  const emps=visibleEmps();if(!emps.length)return toast('No employees to export.');
  const head=['Employee','Group','Wage type','Rate','Rate per hour','Regular hrs','OT hrs','Sick hrs','Vacation hrs','Gross pay','OT pay','Sick pay','Vacation pay','Deductions','Net pay'];
  const r2=n=>+Number(n).toFixed(2);
  const data=emps.map(e=>{const c=calc(e);return [e.name,e.group||'',c.type,c.rate,r2(c.hourly),c.reg,c.ot,c.sick,c.vac,r2(c.gross),r2(c.payOt),r2(c.paySick),r2(c.payVac),r2(c.dedTotal),r2(c.net)]});
  const base='payroll-'+pTag();
  if(typeof XLSX!=='undefined'){
    const ws=XLSX.utils.aoa_to_sheet([head].concat(data)),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Payroll');
    saveFile(base+'.xlsx',new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]));
  }else saveFile(base+'.csv','﻿'+[head].concat(data).map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'));
}
$('#restoreIn').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const o=migrate(JSON.parse(await f.text()));if(!o||!Array.isArray(o.employees))throw 0;pendingRestore=remapIds(o);
    openModal('<h2>Restore this backup?</h2><p style="margin:0 0 10px">It contains '+o.employees.length+' employees. Everything now in the database is replaced by the backup. Download a backup of the current data first if you may need it.</p><label class="muted">Type RESTORE to confirm<input type="text" id="cfm" autocomplete="off"></label><div class="actions"><button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="restoreYes">Replace all data</button></div>')}
  catch(err){toast('That is not a Payroll Desk backup file.')}
});
