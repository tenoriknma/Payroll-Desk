<!doctype html>
<html lang="en">
<head>
<title>Payroll Desk</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working surface. Header with period controls, four tabs, a wide scrollable grid or table underneath. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#17211e; --muted:#5b6a65; --line:#d8e0dd; --soft:#e9efed;
  --accent:#2447b5; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --good:#17794f; --good-bg:#dcf2e6; --bad:#b0321e; --bad-bg:#fbe3de; --warn:#8a5a00; --warn-bg:#fff0c9;
  --rest:#e6ebea;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --ink:#e5eeea; --muted:#92a39d; --line:#2a3a37; --soft:#1e2c2a;
  --accent:#8aa4ff; --accent-ink:#0b1230; --accent-soft:#1f2a4d;
  --good:#5fd39a; --good-bg:#17382b; --bad:#ff8f7a; --bad-bg:#3e201a; --warn:#f0c04d; --warn-bg:#3a2f10;
  --rest:#1b2826; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --ink:#e5eeea; --muted:#92a39d; --line:#2a3a37; --soft:#1e2c2a;
  --accent:#8aa4ff; --accent-ink:#0b1230; --accent-soft:#1f2a4d;
  --good:#5fd39a; --good-bg:#17382b; --bad:#ff8f7a; --bad-bg:#3e201a; --warn:#f0c04d; --warn-bg:#3a2f10;
  --rest:#1b2826; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:24px;letter-spacing:-.01em}
.state{font-size:12px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=text],input[type=email],input[type=number],input[type=month],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.stick{position:sticky;top:0;z-index:20;background:var(--bg);margin-bottom:12px}
.stick .tabs{margin-bottom:0}
.panel.scroll{max-height:calc(100vh - var(--stick,150px) - 28px);overflow:auto}
@media (max-width:700px){.stick{position:static}.panel.scroll{max-height:none}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:4px;font-weight:600;font-size:12px;font-family:var(--f-num)}
.chip.P{background:var(--good-bg);color:var(--good)} .chip.A{background:var(--bad-bg);color:var(--bad)} .chip.R{background:var(--rest);color:var(--muted)} .chip.H{background:var(--warn-bg);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0;z-index:4}
.why td{white-space:normal;vertical-align:top}.why td.n{white-space:nowrap;min-width:110px}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td small,.muted{color:var(--muted);font-size:12px}
td.name{font-weight:500}
td.name small{display:block;font-weight:400}
tfoot td{font-weight:600;background:var(--soft)}
/* attendance grid */
.grid th,.grid td{padding:0;text-align:center;border-right:1px solid var(--line)}
.grid th.day{min-width:34px;cursor:pointer;padding:5px 0;line-height:1.15}
.grid th.day span{display:block;font-family:var(--f-num);font-size:12px;color:var(--ink)}
.grid th.day small{font-size:10px;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400}
.grid th.day.rest{background:var(--rest)}
.grid .lead{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:7px 10px;min-width:150px;border-right:2px solid var(--line)}
.grid thead .lead{z-index:6}
.grid td.cell{width:34px;height:34px;cursor:pointer;font-family:var(--f-num);font-weight:600;user-select:none;position:relative}
.grid td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.grid td.cell.P{background:var(--good-bg);color:var(--good)}
.grid td.cell.A{background:var(--bad-bg);color:var(--bad)}
.grid td.cell.rest{background:var(--rest);color:var(--muted)}
.grid td.cell.H{background:var(--warn-bg);color:var(--warn)}
.grid td.cell.ov::before{content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.grid td.cell.rv::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.grid td.sum{padding:0 10px;font-family:var(--f-num);font-size:13px;min-width:44px}
.grid td.sum.bad{color:var(--bad)} .grid td.sum.warn{color:var(--warn)}
.grid tfoot td{font-size:12px;font-family:var(--f-num)}
.grid tfoot .lead{background:var(--soft)}
input.num{width:104px;text-align:right;font-family:var(--f-num)}
input.num.hr{width:84px}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 40px var(--surface) inset;-webkit-text-fill-color:var(--ink);caret-color:var(--ink)}
.dedrow{display:flex;gap:8px;align-items:center}
.dedrow .dl{flex:1}
.dedrow .da{width:120px}
.sig{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sig img{max-height:64px;max-width:220px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px}
input.num.missing{border-color:var(--warn);background:var(--warn-bg)}
input.txt{width:100%;min-width:140px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--soft);color:var(--muted);font-weight:500}
.badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.good{background:var(--good-bg);color:var(--good)}
.note{padding:10px 12px;border-radius:6px;background:var(--warn-bg);color:var(--warn);margin-bottom:12px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.card{padding:12px 14px}
.card b{display:block;font-family:var(--f-num);font-size:20px;font-weight:500}
.card span{font-size:12px;color:var(--muted)}
.empty{padding:40px 24px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-size:22px} .empty p{margin:0;max-width:52ch;color:var(--muted)}
.form{display:grid;gap:12px;max-width:640px}
.form.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.field{display:grid;gap:4px;align-content:start} .field label{font-size:12px;font-weight:600;color:var(--muted)} .field .hint{font-size:12px;color:var(--muted)}
.field input,.field select{width:100%;height:38px;box-sizing:border-box;font:inherit;padding:0 10px}
.field input[type=checkbox]{width:auto;height:auto}
.fundsbox{max-width:640px;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px;background:var(--surface)}
.fundsbox h3{margin:0 0 8px;font-size:14px}
.flog{max-height:130px;overflow:auto;font-size:12px;margin-top:8px}
.flog td,.flog th{padding:3px 8px;white-space:normal}
.settings{display:grid;gap:16px;padding:18px;margin-bottom:16px}
.settings h3{font-size:17px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px}
#modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(10,16,15,.55);z-index:50;overflow:auto;padding:5vh max(12px,env(safe-area-inset-left,0px))}
#modal.open{display:flex}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(760px,100%);display:grid;gap:14px}
.dlg h2{font-size:20px}
.dlg .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;display:none;max-width:90vw;font-size:13px}
@media (max-width:600px){.top{padding-block:12px 8px}.brand h1{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0}
.menu{position:relative;display:inline-block}
.menuList{position:absolute;top:calc(100% + 4px);left:0;z-index:20;min-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:4px;display:grid;white-space:nowrap}
.menuList[hidden]{display:none}
.menuList button{all:unset;cursor:pointer;padding:8px 12px;border-radius:6px;color:var(--ink)}
.menuList button:hover,.menuList button:focus-visible{background:var(--accent-soft);outline:none}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin-bottom:6px}.rate{min-width:0;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;align-content:start;background:var(--soft)}.rate .rt{font-weight:600;font-size:13px}.rate .rv{display:flex;align-items:center;gap:8px}.rate .rv input,.rate .rv select{width:100%;max-width:100%;height:38px;box-sizing:border-box;flex:1;min-width:0}.rate .unit{color:var(--muted);font-size:12px;white-space:nowrap}h4.sub{margin:14px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.form.two.setup{max-width:760px;gap:16px 20px;grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:560px){.form.two.setup{grid-template-columns:1fr}}.locrow{display:flex;gap:6px;align-items:center}.locrow input{flex:1;min-width:0}.info{display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border:1px solid var(--muted);border-radius:50%;color:var(--muted);font:italic 700 11px/1 Georgia,serif;cursor:help;position:relative;vertical-align:middle;outline:none}.info:hover,.info:focus-visible{background:var(--soft);color:var(--ink);border-color:var(--ink)}.info:hover::after,.info:focus::after{content:attr(data-tip);position:absolute;left:-8px;bottom:calc(100% + 8px);width:max-content;max-width:290px;padding:8px 10px;border-radius:8px;background:var(--ink);color:var(--surface);font:400 12px/1.4 system-ui,sans-serif;font-style:normal;white-space:pre-line;overflow-wrap:normal;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:30;pointer-events:none}
.dedpre .da{width:130px}.dedpre .chk{min-width:0}
.cabox{display:grid;gap:6px;margin:-2px 0 4px 26px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}.cabox select{height:38px;box-sizing:border-box}
html.locked .app{display:none}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#gate[hidden]{display:none}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(420px,100%)}
.gbox h1{margin:0 0 6px;font-size:22px}
.gbox label{display:block;margin:12px 0;font-weight:500}
.gbox input{display:block;width:100%;margin-top:4px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit}
.gbox .gerr{color:#b42318;min-height:1.4em;margin:6px 0}
.gbox .qr{display:flex;justify-content:center;margin:10px 0}.gbox .qr img{width:200px;height:200px;background:#fff;padding:6px;border-radius:6px}
.gbox code{word-break:break-all;background:var(--soft);padding:2px 5px;border-radius:4px}
input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
#who{margin-left:8px}
</style>

</head>
<body>
<div class="app">
  <div class="stick">
  <header class="top">
    <div class="brand"><h1>Payroll Desk</h1><span class="state" id="saveState"></span><span class="state" id="who"></span><button class="btn sm" data-act="signOut">Sign out</button></div>
    <div class="ctrls">
      <div class="seg" id="partSeg" role="group" aria-label="Pay period">
        <button data-act="part" data-part="week">Week</button>
        <button data-act="part" data-part="first">1–15</button>
        <button data-act="part" data-part="second">16–end</button>
        <button data-act="part" data-part="month">Month</button>
      </div>
      <input type="month" id="monthIn" aria-label="Payroll month">
      <span class="ctrls" id="weekCtl" hidden>
        <button class="btn sm" data-act="shiftWeek" data-dir="-1" aria-label="Previous week">◀</button>
        <label class="muted" for="endIn">Week ending</label>
        <input type="date" id="endIn">
        <button class="btn sm" data-act="shiftWeek" data-dir="1" aria-label="Next week">▶</button>
      </span>
      <select id="siteSel" aria-label="Show employees"></select>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-act="tab" data-tab="attendance">Attendance</button>
    <button role="tab" data-act="tab" data-tab="payroll">Payroll</button>
    <button role="tab" data-act="tab" data-tab="reconcile">Reconciliation</button>
    <button role="tab" data-act="tab" data-tab="employees">Employees</button>
    <button role="tab" data-act="tab" data-tab="settings">Settings</button>
  </nav>
  </div>
  <main id="view"></main>
</div>
<div id="gate" hidden></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".xls,.xlsx" hidden>
<input type="file" id="restoreIn" accept=".json,application/json" hidden>
<input type="file" id="sigIn" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Su','Mo','Tu','We','Th','Fr','Sa'];
const titleCase=s=>String(s).trim().replace(/\s+/g,' ').replace(/\b([a-z])/g,m=>m.toUpperCase());
const money=n=>{n=Number(n)||0;return (n<0?'-':'')+S.settings.currency+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function lastFriday(){const n=new Date();n.setDate(n.getDate()-((n.getDay()-5+7)%7));return isoOf(n)}

/* ---------- state + storage ---------- */
function defaults(){
  const n=new Date();
  return {employees:[],att:{},review:{},hrs:{},adj:{},locked:{},paid:{},siteFilter:'all',savedAt:0,
    period:{ym:n.getFullYear()+'-'+pad(n.getMonth()+1),part:'week',end:lastFriday()},
    settings:{company:'EASTLAND MANAGEMENT CONSULTANCY and ASSISTANCE SERVICES CO.',sites:{office:'Office',field:'Site'},currency:'₱',factor:313,restDays:[0],punchRule:'any',hoursPerDay:8,otRate:1,companyAddress:'Unit G-H Everex Minimart BLDG., Sitio Halang na Gubat, Brgy. Sampaloc Tanay, Rizal',locOrder:['office','field','loc_pyq544v','loc_hnshxwb','loc_rteac26','loc_kb6zvme'],restPremium:false,holidays:false,holidayList:[],fDaily:'rate * days',fMonthly:'max(0, salary * share - absentDays * dailyRate) + restDays * dailyRate',signature:'',signLabel:"Accounting Head's signature"}};
}
function migrate(s){
  if(!s||typeof s!=='object')return null;
  const o=Object.assign(defaults(),s);
  o.settings=Object.assign(defaults().settings,s.settings||{});if(o.settings.company==='Eastland Management Consultancy & Ass.')o.settings.company='EASTLAND MANAGEMENT CONSULTANCY and ASSISTANCE SERVICES CO.';o.settings.restDays=[0];if(!o.settings.companyAddress)o.settings.companyAddress='Unit G-H Everex Minimart BLDG., Sitio Halang na Gubat, Brgy. Sampaloc Tanay, Rizal';
  {const sv=(s.settings||{}).sites;o.settings.sites=sv&&Object.keys(sv).length?Object.assign({},sv):{office:'Office',field:'Site'}}
  ['att','review','hrs','adj','locked','paid'].forEach(k=>o[k]=o[k]||{});
  o.employees=o.employees||[];
  o.employees.forEach(e=>{if(!e.dedPrefs||typeof e.dedPrefs!=='object')e.dedPrefs=e.fundsOn?{Fund:{on:true,a:(e.fundsAmt!=null&&e.fundsAmt!==''?num(e.fundsAmt):FUNDS_DEFAULT)}}:{}});
  o.period=Object.assign({part:'month',end:lastFriday()},o.period||{});
  return o;
}
/* ---------- cloud: configuration, sign-in and database ---------- */
const CFG={url:'https://vilmomebbujnzrdvizur.supabase.co',key:'sb_publishable_aZ5UF-9-vic4hBF051tIgw_pudhkXal'};
const sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const UIKEY='payrolldesk.ui',IDLE_MS=30*60*1000;
const newId=()=>crypto.randomUUID();
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
let pendingRestore=null,S=defaults(),tab='attendance',saveTimer=null,RO=false,me={id:'',email:'',role:''};
function setState(t){const el=$('#saveState');if(el)el.textContent=t}
function uiLoad(){try{const u=JSON.parse(localStorage.getItem(UIKEY)||'null');if(u){if(u.period)S.period=Object.assign(S.period,u.period);if(u.siteFilter)S.siteFilter=u.siteFilter;if(u.tab)tab=u.tab}}catch(e){}}
function uiSave(){try{localStorage.setItem(UIKEY,JSON.stringify({period:S.period,siteFilter:S.siteFilter,tab}))}catch(e){}}

/* tables, keys and order (parents first when writing, children first when deleting) */
const KEYS={locations:['key'],employees:['id'],payroll_paid:['payroll_key'],payroll_locks:['payroll_key'],attendance:['employee_id','work_date'],hour_overrides:['employee_id','work_date'],payroll_adjustments:['payroll_key','employee_id'],payroll_paid_rows:['payroll_key','employee_id'],settings:['id']};
const UP=['locations','employees','payroll_paid','payroll_locks','attendance','hour_overrides','payroll_adjustments','payroll_paid_rows','settings'];
const DOWN=['payroll_paid_rows','payroll_adjustments','hour_overrides','attendance','payroll_locks','payroll_paid','employees','locations'];

function normalize(){
  const T={};UP.forEach(t=>T[t]=new Map());
  const put=(t,row)=>T[t].set(KEYS[t].map(k=>row[k]).join('|'),{r:row,j:JSON.stringify(row)});
  const sites=S.settings.sites||{},ids=new Set(),fallbackLoc=sites.office?'office':(Object.keys(sites)[0]||null);
  for(const k in sites)put('locations',{key:k,name:String(sites[k])});
  S.employees.forEach(e=>{ids.add(e.id);
    put('employees',{id:e.id,name:e.name||'',group_name:e.group||'',bio_id:e.bioId||'',location_key:sites[e.site]?e.site:fallbackLoc,position:e.position||'',wage_type:e.wageType==='monthly'?'monthly':'daily',rate:num(e.rate),deduction:num(e.deduction),address:e.address||'',contact:e.contact||'',email:e.email||'',manager:e.manager||'',active:e.active!==false,ded_prefs:(e.dedPrefs&&typeof e.dedPrefs==='object')?e.dedPrefs:{},ca_plan:e.caPlan||null,ca_log:Array.isArray(e.caLog)?e.caLog:[],funds_on:!!e.fundsOn,funds_amount:e.fundsAmt!=null&&e.fundsAmt!==''?num(e.fundsAmt):400,funds_total:num(e.fundsTotal),funds_log:Array.isArray(e.fundsLog)?e.fundsLog:[]})});
  const mk=m=>m==='P'||m==='H'||m==='A'?m:null;
  const attIds=new Set([...Object.keys(S.att),...Object.keys(S.review)]);
  attIds.forEach(id=>{if(!ids.has(id))return;const a=S.att[id]||{},r=S.review[id]||{};
    new Set([...Object.keys(a),...Object.keys(r)]).forEach(d=>{const m=mk(a[d]),f=!!r[d];if(m||f)put('attendance',{employee_id:id,work_date:d,mark:m,needs_review:f})})});
  for(const id in S.hrs){if(!ids.has(id))continue;for(const d in S.hrs[id]){const o=S.hrs[id][d];
    put('hour_overrides',{employee_id:id,work_date:d,regular:o.r!=null?num(o.r):null,overtime:num(o.o),sick:num(o.s),vacation:num(o.v)})}}
  for(const pk in S.adj){for(const id in S.adj[pk]){if(!ids.has(id))continue;const a=S.adj[pk][id];
    put('payroll_adjustments',{payroll_key:pk,employee_id:id,rate:a.rate!=null?num(a.rate):null,wage_type:a.type==='monthly'||a.type==='daily'?a.type:null,deductions:(a.ded||[]).map(x=>({l:x.l,a:x.a}))})}}
  for(const pk in S.locked)if(S.locked[pk])put('payroll_locks',{payroll_key:pk});
  for(const pk in S.paid){const P=S.paid[pk];put('payroll_paid',{payroll_key:pk,label:P.label||''});
    for(const id in P.rows){if(!ids.has(id))continue;const r=P.rows[id];
      put('payroll_paid_rows',{payroll_key:pk,employee_id:id,paid_on:r.date||null,reference:r.ref||'',pay:num(r.pay),deductions:num(r.ded),funds:num(r.funds),cash_adv:r.ca||null,net:num(r.net),by_date:r.by||{}})}}
  const st=Object.assign({},S.settings);delete st.sites;put('settings',{id:1,data:st});
  return T;
}
const toSnap=T=>{const o={};UP.forEach(t=>{o[t]=new Map([...T[t]].map(([k,v])=>[k,v.j]))});return o};

let snap=null,syncing=false,dirty=false,allowBulk=false,retryT=null;
function diff(cur){
  const up={},del={};let delCount=0,upCount=0;
  UP.forEach(t=>{up[t]=[];del[t]=[];
    for(const [k,v] of cur[t])if(snap[t].get(k)!==v.j){up[t].push(v.r);upCount++}
    for(const [k,j] of snap[t])if(!cur[t].has(k)){del[t].push(JSON.parse(j));delCount++}});
  return {up,del,delCount,upCount};
}
const chunks=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
async function apply(ops){
  for(const t of UP){for(const c of chunks(ops.up[t],400)){
    const {error}=await sb.from(t).upsert(c,{onConflict:KEYS[t].join(',')});if(error)throw error}}
  for(const t of DOWN){const rows=ops.del[t];if(!rows.length)continue;const ks=KEYS[t];
    if(ks.length===1){for(const c of chunks(rows.map(r=>r[ks[0]]),100)){const {error}=await sb.from(t).delete().in(ks[0],c);if(error)throw error}}
    else{const g={};rows.forEach(r=>{(g[r[ks[0]]]=g[r[ks[0]]]||[]).push(r[ks[1]])});
      for(const a in g)for(const c of chunks(g[a],150)){const {error}=await sb.from(t).delete().eq(ks[0],a).in(ks[1],c);if(error)throw error}}}
}
async function sync(){
  if(RO||!snap)return;
  if(syncing){dirty=true;return}
  syncing=true;clearTimeout(retryT);
  try{
    do{dirty=false;const cur=normalize(),ops=diff(cur);
      if(ops.delCount>300&&!allowBulk){const n=ops.delCount;syncing=false;setState('Not saved: large deletion held');bulkAsk(n);return}
      if(ops.delCount||ops.upCount)await apply(ops);
      snap=toSnap(cur)}while(dirty);
    allowBulk=false;setState('Saved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    console.error(e);
    const msg=String((e&&e.message)||e);
    if(/JWT|expired|401|not authenticated/i.test(msg)){const {data}=await sb.auth.getSession();if(!data.session){location.reload();return}}
    setState('Not saved. Retrying…');retryT=setTimeout(sync,5000);
  }finally{syncing=false}
}
function bulkAsk(n){openModal('<h2>Large deletion held back</h2><p style="margin:0">This change would remove '+n+' records from the database at once. Nothing was deleted. If you meant to do this, choose Delete. If not, choose Undo and the page reloads with the saved data.</p><div class="actions"><button class="btn" data-act="bulkNo">Undo and reload</button><button class="btn danger" data-act="bulkYes">Delete '+n+' records</button></div>')}
function save(){
  S.savedAt=Date.now();uiSave();
  if(RO){setState('View only. Changes are not saved.');return}
  if(!snap)return;
  setState('Saving…');clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;sync()},700);
}
window.addEventListener('beforeunload',e=>{if(!RO&&(saveTimer||syncing||dirty||retryT)&&snap){e.preventDefault();e.returnValue=''}});

async function fetchAll(t,order){let out=[],from=0;
  for(;;){let q=sb.from(t).select('*');order.forEach(o=>{q=q.order(o)});const {data,error}=await q.range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}
  return out}
async function loadAll(){

  const o=defaults();
  o.settings=Object.assign(o.settings,(set[0]&&set[0].data)||{});if(o.settings.company==='Eastland Management Consultancy & Ass.')o.settings.company='EASTLAND MANAGEMENT CONSULTANCY and ASSISTANCE SERVICES CO.';o.settings.restDays=[0];if(!o.settings.companyAddress)o.settings.companyAddress='Unit G-H Everex Minimart BLDG., Sitio Halang na Gubat, Brgy. Sampaloc Tanay, Rizal';
  const sites={};loc.forEach(l=>sites[l.key]=l.name);o.settings.sites=Object.keys(sites).length?sites:{office:'Office',field:'Site'};
  o.employees=emp.map(e=>({id:e.id,name:e.name,group:e.group_name,bioId:e.bio_id,site:e.location_key||'office',position:e.position,wageType:e.wage_type,rate:Number(e.rate),deduction:Number(e.deduction),address:e.address,contact:e.contact,email:e.email,manager:e.manager,active:e.active,caPlan:e.ca_plan||null,caLog:e.ca_log||[],dedPrefs:(e.ded_prefs&&Object.keys(e.ded_prefs).length)?e.ded_prefs:(e.funds_on?{Fund:{on:true,a:e.funds_amount!=null?Number(e.funds_amount):400}}:{}),fundsOn:!!e.funds_on,fundsAmt:e.funds_amount!=null?Number(e.funds_amount):400,fundsTotal:Number(e.funds_total||0),fundsLog:e.funds_log||[]}));
  att.forEach(r=>{if(r.mark){(o.att[r.employee_id]=o.att[r.employee_id]||{})[r.work_date]=r.mark}if(r.needs_review){(o.review[r.employee_id]=o.review[r.employee_id]||{})[r.work_date]=1}});
  hrs.forEach(r=>{const v={};if(r.regular!=null)v.r=Number(r.regular);if(Number(r.overtime))v.o=Number(r.overtime);if(Number(r.sick))v.s=Number(r.sick);if(Number(r.vacation))v.v=Number(r.vacation);(o.hrs[r.employee_id]=o.hrs[r.employee_id]||{})[r.work_date]=v});
  adj.forEach(r=>{const a={};if(r.rate!=null)a.rate=Number(r.rate);if(r.wage_type)a.type=r.wage_type;a.ded=r.deductions||[];(o.adj[r.payroll_key]=o.adj[r.payroll_key]||{})[r.employee_id]=a});
  lck.forEach(r=>o.locked[r.payroll_key]=true);
  pd.forEach(r=>o.paid[r.payroll_key]={label:r.label,rows:{}});
  pdr.forEach(r=>{const P=o.paid[r.payroll_key];if(P)P.rows[r.employee_id]={date:r.paid_on,ref:r.reference,pay:Number(r.pay),ded:Number(r.deductions),funds:Number(r.funds),ca:r.cash_adv||null,net:Number(r.net),by:r.by_date||{}}});

document.addEventListener('submit',async e=>{
  const f=e.target;if(f.id!=='fLogin'&&f.id!=='fCode')return;e.preventDefault();
  const b=$('#gBtn');b.disabled=true;gmsg('');
  try{
    if(f.id==='fLogin'){

      if(error){b.disabled=false;gmsg('Wrong email or password.');$('#gPass').value='';return}

async function afterPassword(){
  const {data:lv,error}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(error)throw error;
  if(lv.currentLevel==='aal2')return enter();
  const {data:fl,error:e2}=await sb.auth.mfa.listFactors();if(e2)throw e2;
  const ver=(fl.totp||[]).find(x=>x.status==='verified');
  if(ver)return showCode(ver.id);
  for(const x of (fl.all||[]).filter(x=>x.factor_type==='totp'&&x.status!=='verified'))await sb.auth.mfa.unenroll({factorId:x.id});
  const {data,error:e3}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Payroll Desk '+new Date().toISOString().slice(0,10)});
  if(e3)throw e3;showEnrol(data);
}
async function enter(){
  gate('<h1>Payroll Desk</h1><p class="muted">Loading your data…</p>');
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return showLogin();
  me={id:user.id,email:user.email||'',role:''};
  const {data:st,error}=await sb.from('staff_users').select('role').eq('user_id',user.id).maybeSingle();
  if(error)return showFail('Could not check your access. '+error.message);
  if(!st)return showNoAccess();
  me.role=st.role;RO=st.role!=='admin';
  try{S=await loadAll()}catch(e){return showFail('Could not load the data. '+(e.message||e))}
  uiLoad();snap=toSnap(normalize());
  $('#gate').hidden=true;document.documentElement.classList.remove('locked');
  $('#who').textContent=me.email+(RO?' (view only)':'');
  setState(RO?'View only. Changes are not saved.':'Saved');
  syncHeader();render();startIdle();
}

function remapIds(o){
  const map={};const f=id=>UUID_RE.test(id)?id:(map[id]=map[id]||newId());
  o.employees.forEach(e=>{e.id=f(e.id)});
  const re=obj=>{const n={};for(const k in obj)n[f(k)]=obj[k];return n};
  o.att=re(o.att);o.review=re(o.review);o.hrs=re(o.hrs);
  for(const pk in o.adj)o.adj[pk]=re(o.adj[pk]);

/* ---------- period + calendar ---------- */
function ymParts(ym){const [y,m]=(ym||S.period.ym).split('-').map(Number);return{y,m}}
const parseISO=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
function datesOf(ym,part,end){
  if(part==='week'){const e=parseISO(end),out=[];for(let i=6;i>=0;i--)out.push(isoOf(new Date(e.getFullYear(),e.getMonth(),e.getDate()-i)));return out}
  const {y,m}=ymParts(ym);const dim=new Date(y,m,0).getDate();let a=1,b=dim;
  if(part==='first')b=Math.min(15,dim);if(part==='second')a=16;
  const out=[];for(let d=a;d<=b;d++)out.push(y+'-'+pad(m)+'-'+pad(d));return out;
}
const periodDates=()=>datesOf(S.period.ym,S.period.part,S.period.end);
const dowOf=iso=>parseISO(iso).getDay();
const isWork=iso=>!S.settings.restDays.includes(dowOf(iso));
const pKey=()=>S.period.part==='week'?'w:'+S.period.end:S.period.ym+':'+S.period.part;
const pTag=()=>S.period.part==='week'?'week-ending-'+S.period.end:S.period.ym+(S.period.part==='month'?'':'-'+S.period.part);
const fmtUS=iso=>iso.slice(5,7)+'/'+iso.slice(8)+'/'+iso.slice(0,4);
const fmtMD=iso=>iso.slice(5,7)+'/'+iso.slice(8);
const short=iso=>MONTHS[+iso.slice(5,7)-1].slice(0,3)+' '+(+iso.slice(8));
function periodLabel(){
  if(S.period.part==='week'){const d=periodDates();return short(d[0])+' – '+short(d[6])+', '+d[6].slice(0,4)}
  const {y,m}=ymParts();const dim=new Date(y,m,0).getDate();const mn=MONTHS[m-1]+' '+y;
  if(S.period.part==='first')return '1–15 '+mn;if(S.period.part==='second')return '16–'+dim+' '+mn;return mn;
}
const periodWord=()=>S.period.part==='week'?'Weekly':S.period.part==='month'?'Monthly':'Semi-monthly';
function periodDateText(){const d=periodDates();return S.period.part==='week'?fmtUS(d[6]):fmtUS(d[0])+' – '+fmtUS(d[d.length-1])}
const siteName=k=>S.settings.sites[k]||k;
/* Employees stay together by location in the order of settings.locOrder, then A to Z by name. Locations not in that list come last. */
const LOC_NAMES=['OFFICE','OFFICE SITE','DAYAPA SITE','PA-OO SITE','BINANGONAN SITE','BARAS SITE'];
const normLoc=t=>String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
/* Rank by the location's current name first (so renamed or re-created locations still sort right), then by its saved key. */
const siteRank=k=>{const n=LOC_NAMES.map(normLoc).indexOf(normLoc(siteName(k)));if(n>=0)return n;const i=(S.settings.locOrder||[]).indexOf(k);return i<0?1e6:100+i};
const empCmp=(a,b)=>siteRank(a.site)-siteRank(b.site)||siteName(a.site).localeCompare(siteName(b.site),undefined,{sensitivity:'base'})||(a.name||'').localeCompare(b.name||'',undefined,{sensitivity:'base'});
function filterLabel(){const f=S.siteFilter;return f==='all'?'':f.startsWith('g:')?f.slice(2):siteName(f)}

const closeMenus=()=>document.querySelectorAll('.menuList').forEach(m=>{m.hidden=true;if(m.previousElementSibling)m.previousElementSibling.setAttribute('aria-expanded','false')});
const typeTag=t=>t==='all'?'':'-'+t;

/* Payslip sheets follow "Group on payslip": WEEKLY goes with Daily wage, SEMI - MONTHLY with Monthly salary. Other groups fall back to the wage type. */
const slipKind=e=>{const g=(e.group||'').toLowerCase().replace(/[^a-z]/g,'');return g.startsWith('semi')?'monthly':g.startsWith('week')?'daily':adjOf(e).type};
const ofSlipType=(l,t)=>t==='all'?l:l.filter(e=>slipKind(e)===t);
function visibleEmps(){
  const pk=pKey(),lk=S.locked[pk],f=S.siteFilter;
  const ok=e=>f==='all'||((S.settings.sites[f]!==undefined)?e.site===f:('g:'+(e.group||''))===f);

const FUNDS_DEFAULT=400;
const who=()=>(typeof me!=='undefined'&&me&&me.email)||'User';
const DED_PRESETS=[{k:'Late',n:'Late'},{k:'Cash Advance',n:'Cash Advance'},{k:'Fund',n:'Fund',rec:1},{k:'LWOP',n:'LWOP (Leave without Pay)'},{k:'SSS',n:'SSS',rec:1},{k:'PHILHEALTH',n:'PHILHEALTH',rec:1},{k:'Pag-Ibig',n:'Pag-Ibig',rec:1}];
const dedKey=l=>{const t=String(l||'').toLowerCase().replace(/[^a-z]/g,'');return ({absent:'Absent',halfday:'Half day',late:'Late',cashadvance:'Cash Advance',fund:'Fund',funds:'Fund',lwop:'LWOP',lwopleavewithoutpay:'LWOP',sss:'SSS',philhealth:'PHILHEALTH',pagibig:'Pag-Ibig'})[t]||null};
const prefsOf=e=>(e&&e.dedPrefs)||{};
const fundOn=e=>!!(prefsOf(e).Fund||{}).on;
/* Cash advance paid back in equal instalments (3, 6, 9 or 12 payrolls). Progress moves when a payroll is recorded as paid. */
const isSemi=e=>/semi/i.test((e&&e.group)||'');
const caR2=n=>Math.round(n*100)/100;

function payDefault(){

/* Funds balance: every change is kept in the employee's own history with who and when. */
function fundsMove(e,delta,kind,note){
  e.fundsTotal=Math.round((num(e.fundsTotal)+delta)*100)/100;
  (e.fundsLog=e.fundsLog||[]).push({t:new Date().toISOString(),by:who(),kind,amt:Math.round(delta*100)/100,bal:e.fundsTotal,note:note||''});
}
function recordPaid(date,ref){
  const pk=pKey();
  if(!S.locked[pk]){S.adj[pk]=S.adj[pk]||{};
    visibleEmps().forEach(e=>{const a=adjOf(e);S.adj[pk][e.id]=Object.assign(S.adj[pk][e.id]||{},{rate:a.rate,type:a.type,funds:a.funds,ded:a.ded.map(x=>x.cap?{l:x.l,a:x.a,cap:x.cap}:{l:x.l,a:x.a})})});
    S.locked[pk]=true}
  const P=S.paid[pk]=S.paid[pk]||{label:periodLabel(),rows:{}},r4=n=>Math.round(n*1e4)/1e4;
  visibleEmps().forEach(e=>{const c=calc(e),by={};for(const d in c.by)by[d]=r4(c.by[d]);
    const prev=num((P.rows[e.id]||{}).funds),delta=r4(c.funds-prev);
    if(delta)fundsMove(e,delta,delta>0?'deposit':'correction',periodLabel());
    const cl=c.ded.find(x=>x.cap),ncap=cl?{a:cl.cap.a,i:cl.cap.i,n:cl.cap.n,bal:cl.cap.bal}:null,pcap=(P.rows[e.id]||{}).ca||null;
    if(e.caPlan&&(ncap||pcap)){e.caPlan.paid=Math.max(0,num(e.caPlan.paid)+(ncap?1:0)-(pcap?1:0));e.caPlan.paidAmt=Math.max(0,caR2(num(e.caPlan.paidAmt)+(ncap?ncap.a:0)-(pcap?pcap.a:0)))}
    P.rows[e.id]={date,ref,pay:r4(c.gross+c.payOt+c.paySick+c.payVac),ded:r4(c.dedTotal),funds:r4(c.funds),net:r4(c.net),ca:ncap,by}});
  save();
}
let recYm=null;
function viewReconcile(){
  if(!S.employees.length)return emptyState();
  const ym=recYm||S.period.ym,dates=datesOf(ym,'month'),emps=visibleEmps(),T={earned:0,paid:0,bal:0,net:0};let rows='';
  for(const e of emps){
    const c=calcCore(e,dates,{rate:e.rate,type:e.wageType,ded:[]},'month'),earned=dates.reduce((t,d)=>t+c.by[d],0);
    let paidFor=0,netIn=0;
    for(const pk in S.paid){const r=S.paid[pk].rows[e.id];if(!r)continue;for(const d in r.by)if(d.slice(0,7)===ym)paidFor+=r.by[d];if(r.date.slice(0,7)===ym)netIn+=r.net}
    const bal=earned-paidFor;T.earned+=earned;T.paid+=paidFor;T.bal+=bal;T.net+=netIn;
    const st=Math.abs(bal)<0.005?'<span class="badge good">Settled</span>':bal>0?'<span class="badge warn">Still due</span>':'<span class="badge warn">Overpaid</span>';
    rows+='<tr><td class="name">'+esc(e.name)+(c.unmarked?' <span class="badge warn" title="Working days not marked">'+c.unmarked+' unmarked</span>':'')+'<small>'+esc(e.group||siteName(e.site))+' · '+(e.wageType==='daily'?'Daily wage':'Monthly salary')+'</small></td>'+
      '<td class="n">'+money(earned)+'</td><td class="n">'+money(paidFor)+'</td><td class="n"><b>'+money(bal)+'</b></td><td class="n">'+money(netIn)+'</td><td>'+st+'</td></tr>';

  const runs={};
  for(const pk in S.paid){const P=S.paid[pk];for(const id in P.rows){const r=P.rows[id];if(r.date.slice(0,7)!==ym)continue;
    const k=r.date+'|'+pk+'|'+(r.ref||'');(runs[k]=runs[k]||{date:r.date,label:P.label,ref:r.ref||'',n:0,net:0});runs[k].n++;runs[k].net+=r.net}}
  const rr=Object.values(runs).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>'<tr><td>'+esc(fmtUS(r.date))+'</td><td>'+esc(r.label)+'</td><td>'+esc(r.ref)+'</td><td class="n">'+r.n+'</td><td class="n">'+money(r.net)+'</td></tr>').join('');
  const [yy,mm]=ym.split('-');
  return '<div class="bar"><label class="muted" for="recMonth">Month</label><input type="month" id="recMonth" value="'+ym+'" aria-label="Month to reconcile"><span class="grow"></span></div>'+
  '<div class="cards"><div class="panel card"><b>'+money(T.earned)+'</b><span>Earned for '+esc(MONTHS[+mm-1])+' '+yy+'</span></div><div class="panel card"><b>'+money(T.paid)+'</b><span>Paid for this month\'s work</span></div><div class="panel card"><b>'+money(T.bal)+'</b><span>Balance still due</span></div></div>'+
  '<div class="panel scroll"><table><thead><tr><th>Employee</th><th class="n">Earned this month</th><th class="n">Paid for this month\'s work</th><th class="n">Balance</th><th class="n">Net paid on dates in this month</th><th>Status</th></tr></thead><tbody>'+rows+
  '</tbody><tfoot><tr><td>Total</td><td class="n">'+money(T.earned)+'</td><td class="n">'+money(T.paid)+'</td><td class="n">'+money(T.bal)+'</td><td class="n">'+money(T.net)+'</td><td></td></tr></tfoot></table></div>'+
  '<h3 style="margin:18px 0 8px;font-size:16px">Payments recorded in this month</h3>'+
  (rr?'<div class="panel scroll"><table><thead><tr><th>Payment date</th><th>Period</th><th>Reference</th><th class="n">Employees</th><th class="n">Net paid</th></tr></thead><tbody>'+rr+'</tbody></table></div>':'<p class="muted">No payments recorded for this month yet. Use Mark as paid in the Payroll tab.</p>')+
  '<p class="muted" style="margin-top:10px">Earned uses each employee\'s current rate and every attendance day in the month. Each weekly or semi-monthly payment is matched to the days it paid for, so a week that crosses a month end counts toward both months. Work on Oct 31 stays due until the run that pays it is marked paid. Deductions and allowances are in the net amounts, not in the balance.</p>';
}

/* ---------- biometric import ---------- */
function sheetToMatrix(ws){
  const rng=XLSX.utils.decode_range(ws['!ref']||'A1'),m=[];
  for(let r=0;r<=rng.e.r;r++){const row=[];for(let c=0;c<=rng.e.c;c++){const cell=ws[XLSX.utils.encode_cell({r,c})];row.push(cell?cell.v:null)}m.push(row)}
  return m;
}
const hhmm=f=>{if(typeof f!=='number')return String(f);const m=Math.round(f*1440);return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
/* Reads the "Time Card" sheets: three employees per sheet, each block 15 columns wide. */
function parseTimeCards(sheets){
  let range=null;const emps=[];
  for(const sh of sheets){
    const R=sh.rows;
    if(!range){for(const row of R){for(const v of row){if(typeof v==='string'){const m=v.match(/(\d{4})-(\d{2})-(\d{2})\s*~\s*(\d{4})-(\d{2})-(\d{2})/);if(m){range={start:m[1]+'-'+m[2]+'-'+m[3],end:m[4]+'-'+m[5]+'-'+m[6]};break}}}if(range)break}}
    const hdr=R[3]||[];
    for(let c=0;c<hdr.length;c++){
      if(String(hdr[c]==null?'':hdr[c]).trim()!=='Name')continue;
      const start=c-8,name=hdr[c+1],id=(R[4]||[])[c+1];
      if(start<0||!name||!String(name).trim())continue;
      const days=[];
      for(let r=12;r<R.length;r++){
        const m=String(R[r][start]==null?'':R[r][start]).match(/^\s*(\d{1,2})\s+([A-Za-z]{2})/);
        if(!m){if(days.length)break;else continue}
        const p=[];for(let k=start+1;k<=start+13;k++){const v=R[r][k];if(v!=null&&String(v).trim()!=='')p.push(v)}
        days.push({day:+m[1],wd:m[2],n:p.length,first:p.length?hhmm(p[0]):'',last:p.length?hhmm(p[p.length-1]):''});
      }
      emps.push({bio:String(id==null?'':id).trim(),name:titleCase(name),days});
    }
  }
  return {range,employees:emps};
}
function statusMap(pe,ym){
  const {y,m}=ymParts(ym),dim=new Date(y,m,0).getDate(),out={},rv={};let p=0,a=0,one=0;
  for(const d of pe.days){
    if(d.day>dim)continue;const iso=ym+'-'+pad(d.day),work=isWork(iso);
    const ok=S.settings.punchRule==='both'?d.n>=2:d.n>=1;
    if(work)out[iso]=ok?'P':'A';else out[iso]=ok?'P':null;
    if(d.n===1){rv[iso]=1;one++}
    if(out[iso]==='P')p++;else if(out[iso]==='A')a++;
  }
  return {out,rv,present:p,absent:a,single:one};
}
let pending=null;
function matchEmp(pe){return S.employees.find(e=>pe.bio&&String(e.bioId)===pe.bio)||S.employees.find(e=>e.name.toLowerCase()===pe.name.toLowerCase())}

  $('#impGo').textContent=pc.length?'Import anyway':'Import';

/* Finds ticked people whose imported days would change a day already counted in a paid payroll. */
function paidConflicts(){
  const out={};
  for(const o of pending.rows){if(!o.on||!o.ex)continue;const e=o.ex,s=statusMap(o.pe,pending.ym);
    for(const pk in S.paid){const r=S.paid[pk].rows[e.id];if(!r)continue;
      for(const d in s.out){if(!(d in r.by))continue;
        const cur=(S.att[e.id]||{})[d]||null,nw=s.out[d]||null;
        if(cur!==nw||(S.hrs[e.id]||{})[d]){const k=out[pk]=out[pk]||{label:S.paid[pk].label,ids:new Set()};k.ids.add(e.id);break}}}}
  return Object.values(out);
}
function syncImpAll(){
  const a=$('#impAll');if(!a)return;const n=pending.rows.filter(o=>o.on).length;
  a.checked=n>0&&n===pending.rows.length;a.indeterminate=n>0&&n<pending.rows.length;
}
function applyImport(){
  const {rows,ym}=pending,t=$('#imp_type').value;let made=0,done=0;
  if(!rows.some(o=>o.on))return toast('Tick at least one name to import.');
  for(const o of rows){
    if(!o.on)continue;let e=o.ex;
    if(!e){e={id:newId(),name:o.pe.name,bioId:o.pe.bio,site:'office',group:'',position:'',wageType:t,rate:0,deduction:0,active:true};S.employees.push(e);made++}
    else if(!e.bioId&&o.pe.bio)e.bioId=o.pe.bio;
    const s=statusMap(o.pe,ym);S.att[e.id]=S.att[e.id]||{};S.review[e.id]=S.review[e.id]||{};
    for(const d in s.out){if(S.hrs[e.id])delete S.hrs[e.id][d];if(s.out[d])S.att[e.id][d]=s.out[d];else delete S.att[e.id][d];if(s.rv[d])S.review[e.id][d]=1;else delete S.review[e.id][d]}
    done++;

      row([{v:d.name,s:3},{v:d.gross,s:d.hl?6:5},d.ded?{v:d.ded,s:5}:{v:'',s:5},{v:d.why[0]||'',s:3},d.cab?{v:d.cab,s:5}:{v:'',s:5},d.bal?{v:d.bal,s:5}:{v:'',s:5},{f:'C'+rn+'-N(D'+rn+')',v:d.net,s:5}]);
      /* one deduction per row: the other cells of the employee are merged down */
      for(let i=1;i<k;i++)row([{v:'',s:3},{v:'',s:5},{v:'',s:5},{v:d.why[i],s:3},{v:'',s:5},{v:'',s:5},{v:'',s:5}]);
      if(k>1)['B','C','D','F','G','H'].forEach(cl=>M.push(cl+rn+':'+cl+(rn+k-1)))});
    const r1=R.length,sum=k=>L.reduce((t,d)=>t+d[k],0),S_=(c,k,st)=>({f:'SUM('+c+r0+':'+c+r1+')',v:r2(sum(k)),s:st});
    row([{v:'',s:6},S_('C','gross',6),S_('D','ded',6),{v:'',s:6},S_('F','cab',6),S_('G','bal',6),S_('H','net',6)]);
    if(li<order.length-1)blank();
  });
  saveFile('payroll-'+pTag()+(S.siteFilter==='all'?'':'-'+slug(filterLabel()))+'.xlsx',await buildXlsx(R,M,widths));
}
$('#restoreIn').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const o=migrate(JSON.parse(await f.text()));if(!o||!Array.isArray(o.employees))throw 0;pendingRestore=remapIds(o);
    openModal('<h2>Restore this backup?</h2><p style="margin:0 0 10px">It contains '+o.employees.length+' employees. Everything now in the database is replaced by the backup. Download a backup of the current data first if you may need it.</p><label class="muted">Type RESTORE to confirm<input type="text" id="cfm" autocomplete="off"></label><div class="actions"><button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="restoreYes">Replace all data</button></div>')}
  catch(err){toast('That is not a Payroll Desk backup file.')}
});

(function(){const el=document.querySelector('.stick');if(!el)return;const set=()=>document.documentElement.style.setProperty('--stick',el.offsetHeight+'px');set();window.addEventListener('resize',set);if(window.ResizeObserver)new ResizeObserver(set).observe(el)})();
boot();
</script>
